<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PW Crafting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="pw-window" aria-label="Janela de crafting">
      <nav class="tabs" id="tabs"></nav>
      <div class="grid" id="grid"></div>
      <div class="detail" id="detail">
        <p class="hint">Selecione uma arma.</p>
      </div>
    </section>

    <aside class="chain" id="chain" aria-label="Cadeia de Almas">
      <h2>Cadeia de Almas</h2>
      <p class="hint">Selecione uma arma para ver tudo o que precisa construir, do nível 60 até ela.</p>
    </aside>
  </main>

  <section class="materiais total" id="materiais" aria-label="Total de materiais">
    <h2>Total de materiais</h2>
    <p class="hint">Selecione uma arma para ver os materiais, onde dropam e a dificuldade.</p>
  </section>

  <script src="data/data.js"></script>
  <script src="data/drops.js"></script>
  <script src="app.js"></script>
</body>
</html>
